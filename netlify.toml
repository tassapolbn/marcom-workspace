[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URL for the read-only team board shared with the Director.
[[redirects]]
  from = "/team-board"
  to = "/.netlify/functions/team-board"
  status = 200

# The Director's action endpoint used by that board (writes a request only).
[[redirects]]
  from = "/board-action"
  to = "/.netlify/functions/board-action"
  status = 200

# Keep project files off the live site. Netlify publishes this whole folder,
# but only index.html, assets/, site.webmanifest and the functions above are
# part of the app. Everything else answers "not found".
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/UI-CODE-REVIEW.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EVENT-BOARD-PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fix-git-lock.bat"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/google-apps-script/*"
  to = "/404.html"
  status = 404
  force = true

# Function source code; the functions themselves are served from /.netlify/functions.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
